<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Tab Fullscreen Settings</title>
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #1a1a1a;
      color: #eaeaea;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-icon {
      width: 20px;
      height: 20px;
      display: block;
      flex: 0 0 auto;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a2a2a;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #3a3a3a;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #555;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #0b93f6;
    }

    input:checked+.slider:before {
      transform: translateX(20px);
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>
      <img class="title-icon" src="icons/icon32.png" alt="">
      Tab Fullscreen
    </h2>

    <div class="toggle-container">
      <span class="toggle-label">Kích hoạt Mode</span>
      <label class="switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
